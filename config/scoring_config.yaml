# Analytical scoring model — not a real procurement policy.
# Scores are derived from calculated KPIs, never assigned at random.

disclaimer: Analytical supplier scorecard and risk model for a synthetic dataset.

weights:
  quality: 0.40
  delivery: 0.40
  cost: 0.20

# Min-max style floors so a single outlier does not collapse the scale.
normalization:
  defect_rate_cap: 0.12
  cost_variance_pct_cap: 0.18
  lead_time_variance_days_cap: 12
  sla_breach_rate_cap: 0.40

performance_tiers:
  A:
    min_score: 85
    label: Excellent
  B:
    min_score: 70
    label: Good
  C:
    min_score: 55
    label: Watch
  D:
    min_score: 0
    label: Corrective Action

otif_alert_threshold: 0.90

risk:
  # Weighted 0–100 risk index. Documented in docs/scoring_methodology.md.
  weights:
    otif_gap: 0.25
    defect_rate: 0.20
    sla_breach_rate: 0.20
    lead_time_variance: 0.15
    unfavorable_cost_variance: 0.10
    spend_exposure: 0.10
  bands:
    LOW:
      max_score: 25
    MEDIUM:
      max_score: 45
    HIGH:
      max_score: 70
    CRITICAL:
      max_score: 100

recommended_action:
  A: MONITOR
  B: SUPPLIER REVIEW
  C: CORRECTIVE ACTION
  D: QUALIFY ALTERNATE SUPPLIER
  otif_below_threshold: EXPEDITED FOLLOW-UP
  high_cost_variance: NEGOTIATE
