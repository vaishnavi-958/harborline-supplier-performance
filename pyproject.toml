[project]
name = "harborline-supplier-performance"
version = "1.0.0"
description = "Independent Procurement Analytics Project using a synthetic procurement dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "faker",
  "pyyaml",
  "openpyxl",
  "python-dateutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
